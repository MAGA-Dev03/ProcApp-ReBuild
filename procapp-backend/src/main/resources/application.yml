spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/procapp
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # schema comes from Flyway/your SQL files, never auto-generated
    open-in-view: false
  flyway:
    enabled: true
    # Databases built by hand in pgAdmin before Flyway was enabled have no
    # flyway_schema_history table. On first start Flyway records them as
    # being at V5 (verified against V1-V5 by schema diff) and applies V6+.
    # An empty database gets every migration from V1.
    baseline-on-migrate: true
    baseline-version: 5
    baseline-description: Pre-Flyway schema applied by hand
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: 10
  storage:
    attachments-dir: ${ATTACHMENTS_DIR:C:/procapp-data/attachments}
  cors:
    allowed-origins: http://localhost:5173

server:
  port: 8080

 