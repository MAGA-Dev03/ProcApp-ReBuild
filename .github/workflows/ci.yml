name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: procapp-backend

    # Throwaway database matching the URL and user in
    # src/test/resources/application.yml (localhost:5432/procapp, postgres).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: procapp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_PASSWORD: ci-only-password
      # The test config turns Flyway off because locally the schema already
      # exists. The CI database starts empty, so let Flyway build it from V1,
      # then add the roles the tests expect (test-only, src/test/resources).
      SPRING_FLYWAY_ENABLED: 'true'
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/ci-seed
      ATTACHMENTS_DIR: /tmp/procapp-attachments

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # mvnw is committed without the executable bit, so run it through sh.
      - run: sh ./mvnw -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: procapp-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: procapp-frontend/package-lock.json
      - run: npm ci
      # Non-blocking until the existing errors in src/api (no-explicit-any,
      # unused _vars) are fixed; then delete continue-on-error.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
